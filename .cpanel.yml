---
deployment:
  tasks:
    - >-
      /bin/bash -lc 'set -e;
      cd ~/repositories/cevicheria-plataforma;
      cp -f ~/private/application.yaml ~/repositories/cevicheria-plataforma/src/main/resources/;
      ~/apache-maven-3.10.0/bin/mvn -B -ntp clean package -DskipTests;
      install -m 600 target/cevicheria-api.jar ~/public_html/api/cevicheria-api.jar.new;
      mv -f ~/public_html/api/cevicheria-api.jar.new ~/public_html/api/cevicheria-api.jar;
      sudo -n /usr/bin/systemctl restart cevicheria-api.service'