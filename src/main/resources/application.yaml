app:
  jwt:
    secret: ${JWT_SECRET}

server:
  servlet:
    context-path: /api
  port: 2250

spring:
  application:
    name: platform
    version: 1.0
  banner:
    location: classpath:banner.txt
  datasource:
    url: jdbc:mysql://localhost:3306/cevicheria
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: none